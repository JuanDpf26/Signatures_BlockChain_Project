# Despliegue de prueba del backend en Render (Blueprint).
# Render → New → Blueprint → elige este repositorio.
# Los valores marcados con sync: false se llenan a mano en el panel de Render
# (copiándolos de tu .env); nunca se suben a GitHub.
services:
  - type: web
    name: blocksign-backend
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: KEY_ENCRYPTION_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: RECAPTCHA_SECRET
        sync: false
      - key: ALLOW_MOBILE_CAPTCHA_BYPASS
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      # Render gratis bloquea SMTP: el correo sale por la API de Brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: APP_BASE_URL_BACKEND
        sync: false
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: BLOCKCHAIN_PRIVATE_KEY
        sync: false
      - key: BLOCKCHAIN_CONTRACT_ADDRESS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
